  <rect width="760" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="24" y="36" width="120" height="48" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="84" y="66" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Web app</text>
  <line x1="144" y1="60" x2="188" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="188" y="36" width="120" height="48" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
