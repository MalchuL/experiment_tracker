<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">Workspace navigation concept</title>
  <desc id="desc">Sidebar, documentation menu, and projects scope</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="720" height="200" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="16" y="16" width="140" height="168" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="86" y="48" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Sidebar</text>
  <rect x="28" y="64" width="116" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="28" y="94" width="116" height="22" rx="4" fill="#dbeafe"/>
  <rect x="28" y="124" width="116" height="22" rx="4" fill="#e2e8f0"/>
  <text x="86" y="79" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Projects</text>
  <text x="86" y="109" text-anchor="middle" fill="#1d4ed8" font-family="system-ui,sans-serif" font-size="9">Documentation</text>
  <text x="86" y="139" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Teams</text>
  <rect x="172" y="16" width="532" height="44" rx="8" fill="url(#bar)"/>
  <text x="188" y="44" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Documentation</text>
  <text x="330" y="44" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Projects</text>
  <text x="430" y="44" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Workspace header</text>
  <rect x="172" y="72" width="532" height="112" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="440" y="130" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13">Page content</text>
</svg>
