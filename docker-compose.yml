# `docker compose up --build` from repo root. Optional compose overrides: root `.env.example` → `.env`; per-package `.env.example` for local uv/pnpm.
# Alternative: `./scripts/docker-up-public.sh <PUBLIC_URL>` sets CORS + NEXT_PUBLIC_* without a root `.env` (see README).
#
# Public hostname / HTTPS (not localhost): in root `.env` set NEXT_PUBLIC_BASE_URL (API URL for the browser),
# ALLOWED_ORIGINS, OBJECT_STORAGE_ALLOWED_ORIGINS (UI origins), then rebuild `web` and recreate backend/object-storage.
# See README.md → "Custom URL or domain".
name: experiment-tracker

services:
  postgres-backend:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-experiment_tracker}
    ports:
      - "${POSTGRES_BACKEND_PORT:-5435}:5432"
    volumes:
      - ./storage/postgres-backend:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d experiment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-object-storage:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OBJECT_STORAGE_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_OBJECT_STORAGE_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_OBJECT_STORAGE_DB:-object_storage}
    ports:
      - "${POSTGRES_OBJECT_STORAGE_PORT:-5434}:5432"
    volumes:
      - ./storage/postgres-object-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d object_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-mltools:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_MLTOOLS_USER:-mltools}
      POSTGRES_PASSWORD: ${POSTGRES_MLTOOLS_PASSWORD:-mltools}
      POSTGRES_DB: ${POSTGRES_MLTOOLS_DB:-mltools}
    ports:
      - "${POSTGRES_MLTOOLS_PORT:-5436}:5432"
    volumes:
      - ./storage/postgres-mltools:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mltools -d mltools"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./storage/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-yourpass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./storage/clickhouse:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./storage/minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      S3_BUCKET: ${S3_BUCKET:-ml-blobs}
      MLTOOLS_OBJECT_STORAGE_BUCKET: ${MLTOOLS_OBJECT_STORAGE_BUCKET:-mltools}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" \
          && mc mb "local/$$S3_BUCKET" --ignore-existing \
          && mc mb "local/$$MLTOOLS_OBJECT_STORAGE_BUCKET" --ignore-existing

  object-storage:
    build:
      context: .
      dockerfile: python/object_storage/Dockerfile
    environment:
      APP_NAME: ${OBJECT_STORAGE_APP_NAME:-ML Experiment Object Storage}
      API_PREFIX: ${OBJECT_STORAGE_API_PREFIX:-/api}
      # CORS: browser origins allowed to call object-storage (match your UI URL).
      ALLOWED_ORIGINS: ${OBJECT_STORAGE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: ${OBJECT_STORAGE_DATABASE_URL:-postgresql+asyncpg://tracker:tracker@postgres-object-storage:5432/object_storage}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-password}
      S3_BUCKET: ${S3_BUCKET:-ml-blobs}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${OBJECT_STORAGE_PORT:-8002}:8002"
    depends_on:
      postgres-object-storage:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  scalars:
    build:
      context: .
      dockerfile: python/scalars_service/Dockerfile
    environment:
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://default:yourpass@clickhouse:8123/default}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SCALARS_PORT:-8001}:8001"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  mltools-api:
    build:
      context: .
      dockerfile: python/mltools/Dockerfile
    environment: &mltools-environment
      APP_NAME: ${MLTOOLS_APP_NAME:-Experiment Tracker MLTools}
      API_PREFIX: ${MLTOOLS_API_PREFIX:-/internal/mltools}
      DATABASE_URL: ${MLTOOLS_DATABASE_URL:-postgresql+asyncpg://mltools:mltools@postgres-mltools:5432/mltools}
      BACKEND_BASE_URL: ${MLTOOLS_BACKEND_BASE_URL:-http://backend:8000}
      BACKEND_API_TOKEN: ${MLTOOLS_BACKEND_API_TOKEN:-}
      REDIS_URL: ${MLTOOLS_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${MLTOOLS_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${MLTOOLS_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      OBJECT_STORAGE_ENDPOINT: ${MLTOOLS_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${MLTOOLS_OBJECT_STORAGE_ACCESS_KEY:-admin}
      OBJECT_STORAGE_SECRET_KEY: ${MLTOOLS_OBJECT_STORAGE_SECRET_KEY:-password}
      OBJECT_STORAGE_BUCKET: ${MLTOOLS_OBJECT_STORAGE_BUCKET:-mltools}
      OBJECT_STORAGE_REGION: ${MLTOOLS_OBJECT_STORAGE_REGION:-us-east-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MLTOOLS_PORT:-8003}:8003"
    depends_on:
      postgres-mltools:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mltools-worker:
    build:
      context: .
      dockerfile: python/mltools/Dockerfile
    command: ["celery", "-A", "mltools.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment: *mltools-environment
    healthcheck:
      disable: true
    depends_on:
      mltools-api:
        condition: service_healthy
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: python/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tracker:tracker@postgres-backend:5432/experiment_tracker}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-docker-env}
      APP_NAME: ${APP_NAME:-Experiment Tracker}
      API_PREFIX: ${API_PREFIX:-/api}
      # Comma-separated browser origins for CORS (must include your real UI URL if not localhost).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SCALARS_SERVICE_URL: ${SCALARS_SERVICE_URL:-http://scalars:8001/api}
      OBJECT_STORAGE_SERVICE_URL: ${OBJECT_STORAGE_SERVICE_URL:-http://object-storage:8002/api}
      MLTOOLS_SERVICE_URL: ${MLTOOLS_SERVICE_URL:-http://mltools-api:8003/internal/mltools}
      ADMIN_PANEL_KEY: ${ADMIN_PANEL_KEY:-admin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres-backend:
        condition: service_healthy
      scalars:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      mltools-api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-reachable API base URL (rebuild web after changing). See README → "Custom URL or domain".
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Route Handlers must reach the API by Compose DNS, not 127.0.0.1 inside this container.
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://backend:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
