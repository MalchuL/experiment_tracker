services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: object_storage
      POSTGRES_PASSWORD: object_storage
      POSTGRES_DB: object_storage
    ports:
      - "5433:5432"
    volumes:
      - object_storage_db:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  object_storage:
    build:
      context: ../..
      dockerfile: python/object_storage/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://object_storage:object_storage@postgres:5432/object_storage
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-admin}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-password}
      S3_BUCKET: ml-blobs
      API_PREFIX: /api
      ALLOWED_ORIGINS: "*"
    ports:
      - "8010:8002"
    depends_on:
      postgres:
        condition: service_started
      rustfs:
        condition: service_healthy

volumes:
  object_storage_db:
  object_storage_rustfs:
