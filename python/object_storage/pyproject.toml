[project]
name = "object-storage"
version = "0.12.9"
description = "Content-addressable object storage service for experiments"
readme = "README.md"
authors = [
    { name = "Maintainer", email = "email@mail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.31.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "minio>=7.2.10",
    "boto3>=1.35.0",
    "anyio>=4.4.0",
    "experiment-tracker-shared",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.13.2",
]

[tool.uv.sources]
experiment-tracker-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.basedpyright]
extraPaths = ["../shared/src"]

[project.scripts]
object-storage = "object_storage.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
