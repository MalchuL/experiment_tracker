[project]
name = "experiment-tracker-integration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "experiment-tracker-sdk",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-playwright>=0.7",
]

[tool.uv.sources]
experiment-tracker-sdk = { path = "../sdk", editable = true }
experiment-tracker-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
markers = ["browser: real Chromium browser journeys"]
