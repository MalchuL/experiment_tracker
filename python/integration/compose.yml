# Disposable test stack. No host data mounts or development .env.
services:
  postgres-backend:
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: experiment_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d experiment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-object-storage:
    volumes:
      - postgres-object-storage-data:/var/lib/postgresql/data
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: object_storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d object_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    volumes:
      - redis-data:/data
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: yourpass
      CLICKHOUSE_DB: default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  rustfs:
    volumes:
      - rustfs-data:/data
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  object-storage:
    image: experiment-tracker-integration-object-storage:local
    ports:
      - "127.0.0.1:${INTEGRATION_STORAGE_PORT:-18002}:8002"
    build:
      context: ../..
      dockerfile: python/object_storage/Dockerfile
    environment:
      APP_NAME: ML Experiment Object Storage
      API_PREFIX: /api
      # CORS: browser origins allowed to call object-storage (match your UI URL).
      ALLOWED_ORIGINS: http://127.0.0.1:${INTEGRATION_WEB_PORT:-13000}
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@postgres-object-storage:5432/object_storage
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_BUCKET: ml-blobs
      LOG_LEVEL: INFO
    depends_on:
      postgres-object-storage:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  scalars:
    image: experiment-tracker-integration-scalars:local
    ports:
      - "127.0.0.1:${INTEGRATION_SCALARS_PORT:-18001}:8001"
    build:
      context: ../..
      dockerfile: python/scalars_service/Dockerfile
    environment:
      CLICKHOUSE_URL: http://default:yourpass@clickhouse:8123/default
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    image: experiment-tracker-integration-backend:local
    ports:
      - "127.0.0.1:${INTEGRATION_BACKEND_PORT:-18000}:8000"
    build:
      context: ../..
      dockerfile: python/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@postgres-backend:5432/experiment_tracker
      JWT_SECRET: integration-jwt-secret
      APP_NAME: Experiment Tracker
      API_PREFIX: /api
      # Comma-separated browser origins for CORS (must include your real UI URL if not localhost).
      ALLOWED_ORIGINS: http://127.0.0.1:${INTEGRATION_WEB_PORT:-13000}
      SCALARS_SERVICE_URL: http://scalars:8001/api
      OBJECT_STORAGE_SERVICE_URL: http://object-storage:8002/api
      ADMIN_PANEL_KEY: integration-admin
      LOG_LEVEL: INFO
    depends_on:
      postgres-backend:
        condition: service_healthy
      scalars:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  web:
    image: experiment-tracker-integration-web:local
    ports:
      - "127.0.0.1:${INTEGRATION_WEB_PORT:-13000}:3000"
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Browser-reachable backend URL, injected into the frontend at container runtime.
      PUBLIC_API_BASE_URL: http://127.0.0.1:${INTEGRATION_BACKEND_PORT:-18000}
      # Route Handlers must reach the API by Compose DNS, not 127.0.0.1 inside this container.
      SERVER_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-backend-data:
  postgres-object-storage-data:
  redis-data:
  clickhouse-data:
  rustfs-data:
