[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-tracker-sdk"
version = "0.5.16"
description = "Python SDK for Experiment Tracker"
readme = "README.md"
authors = [
  { name = "Maintainer", email = "email@mail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "experiment-tracker-shared",
]

[tool.uv.sources]
experiment-tracker-shared = { path = "../shared", editable = true }

[tool.pyright]
include = ["src"]
exclude = ["tests"]
extraPaths = ["../shared/src"]
typeCheckingMode = "basic"

[tool.basedpyright]
extraPaths = ["../shared/src"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pyright",
  "ruff",
]



[project.scripts]
experiment-tracker = "experiment_tracker_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
