[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-tracker-sdk"
version = "0.3.19"
description = "Python SDK for Experiment Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "experiment-tracker-shared",
]

[tool.uv.sources]
experiment-tracker-shared = { path = "../shared", editable = true }

[tool.basedpyright]
extraPaths = ["../shared/src"]

[project.optional-dependencies]
dev = ["pytest"]



[project.scripts]
experiment-tracker = "experiment_tracker_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
